name: Image CI

# 一个版本号同时出两个镜像，agent 与 server 不允许各自发版、各自打 tag。
# 发布：
#   git tag v0.1.0 && git push origin v0.1.0
#     ->  crpi-...personal.cr.aliyuncs.com/springhgui/kubespoke-agent:0.2.0
#     ->  crpi-...personal.cr.aliyuncs.com/springhgui/kubespoke-server:0.2.0
#   两条路径都会同时刷新两个镜像的 :latest；不带版本号的手动触发只刷 :latest，用于验证流水线本身。
# 注意：对外交付物（deploy-server.sh 的默认 IMAGE、README 的 docker run）刻意钉在具体版本号上，
#       发新版本时要一并改，别让它们停在旧版。
# 前提：Secrets 里有 REGISTRY_PASSWORD（ACR 个人版「访问凭证」的固定密码），
#       且 ACR 控制台已建好 springhgui/kubespoke-agent、springhgui/kubespoke-server 两个仓库。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: crpi-gr7j2r1czfy1t1uu.cn-hangzhou.personal.cr.aliyuncs.com
  REGISTRY_USERNAME: springhgui

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 两个镜像共用同一条流程，一个挂了另一个也别继续发，避免出现一半新一半旧
    strategy:
      fail-fast: true
      matrix:
        include:
          - dockerfile: Dockerfile-agent
            image_name: kubespoke-agent
          - dockerfile: Dockerfile-api
            image_name: kubespoke-server
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
    steps:
      - uses: actions/checkout@v5

      # 登录排在一切重活之前：凭证或仓库不存在的失败，几秒钟就该结束，
      # 别让人等完一趟还原+编译才发现密码不对。
      - name: Log in to Alibaba CR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}
          # match 类型不会自动附带 :latest（那是 type=semver 的行为），所以 latest 无条件补一条，
          # 让 tag 发布和手动触发都把 :latest 追到最新构建。
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      # 不加 buildx 缓存导出：runner 默认的 docker 驱动不支持 --cache-to，
      # 要缓存就得另起 docker-container 驱动，而这两个镜像一次还原只要几十秒，不值得。
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 把 digest 写进作业摘要：集群 manifest 里建议钉 @sha256:... 而不是 :latest
      - name: Record digest
        run: |
          {
            echo "| 镜像 | 来源 ref | digest |"
            echo "| --- | --- | --- |"
            echo "| ${IMAGE_NAME} | ${GITHUB_REF_NAME} | ${{ steps.build.outputs.digest }} |"
          } >> "$GITHUB_STEP_SUMMARY"
