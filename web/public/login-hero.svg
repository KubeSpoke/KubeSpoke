<svg viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KubeSpoke 统一管控多个 Kubernetes 集群">
  <defs>
    <linearGradient id="baseTop" x1="600" y1="380" x2="600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dcebff" stop-opacity=".85"/><stop offset="1" stop-color="#a9c9f5" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="baseSide" x1="600" y1="540" x2="600" y2="705" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9dc0ef"/><stop offset="1" stop-color="#6f9fdc"/>
    </linearGradient>
    <linearGradient id="midTop" x1="600" y1="340" x2="600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6f1ff"/><stop offset="1" stop-color="#9fc3f7"/>
    </linearGradient>
    <linearGradient id="midSide" x1="600" y1="470" x2="600" y2="645" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a78ee"/><stop offset="1" stop-color="#1c4dbd"/>
    </linearGradient>
    <linearGradient id="topTop" x1="600" y1="300" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
    <linearGradient id="topSide" x1="600" y1="430" x2="600" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a86f5"/><stop offset="1" stop-color="#2560d8"/>
    </linearGradient>
    <linearGradient id="slabFace" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9f2ff"/>
    </linearGradient>
    <linearGradient id="beamL" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bfe4ff"/><stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#6db8ff" stop-opacity=".65"/><stop offset="1" stop-color="#6db8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="600" cy="700" rx="300" ry="46" fill="#c7d6ea" opacity=".45" filter="url(#soft)"/>

  <!-- 光束 -->
  <g stroke="url(#beamL)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" opacity=".9">
    <line x1="392" y1="488" x2="303" y2="562"/>
    <line x1="733" y1="392" x2="808" y2="330"/>
    <line x1="798" y1="512" x2="893" y2="588"/>
  </g>
  <g stroke="#eaf7ff" stroke-width="2.5" stroke-linecap="round">
    <line x1="392" y1="488" x2="303" y2="562"/>
    <line x1="733" y1="392" x2="808" y2="330"/>
    <line x1="798" y1="512" x2="893" y2="588"/>
  </g>
  <g>
    <circle cx="392" cy="488" r="16" fill="url(#halo)"/><circle cx="392" cy="488" r="6" fill="#dff2ff"/>
    <circle cx="733" cy="392" r="16" fill="url(#halo)"/><circle cx="733" cy="392" r="6" fill="#dff2ff"/>
    <circle cx="798" cy="512" r="16" fill="url(#halo)"/><circle cx="798" cy="512" r="6" fill="#dff2ff"/>
    <circle cx="303" cy="562" r="14" fill="url(#halo)"/><circle cx="303" cy="562" r="5" fill="#dff2ff"/>
    <circle cx="808" cy="330" r="14" fill="url(#halo)"/><circle cx="808" cy="330" r="5" fill="#dff2ff"/>
    <circle cx="893" cy="588" r="14" fill="url(#halo)"/><circle cx="893" cy="588" r="5" fill="#dff2ff"/>
