      <ellipse cx="516" cy="389" rx="9" ry="6"/><ellipse cx="684" cy="389" rx="9" ry="6"/>
      <ellipse cx="516" cy="473" rx="9" ry="6"/><ellipse cx="684" cy="473" rx="9" ry="6"/>
      <ellipse cx="446" cy="431" rx="9" ry="6"/><ellipse cx="754" cy="431" rx="9" ry="6"/>
    </g>
    <ellipse cx="600" cy="434" rx="44" ry="20" stroke="#b9cdea" stroke-width="17"/>
    <ellipse cx="600" cy="430" rx="44" ry="20" stroke="#ffffff" stroke-width="17"/>
