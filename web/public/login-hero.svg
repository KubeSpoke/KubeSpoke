    <g>
      <rect x="118" y="452" width="196" height="50" rx="25" fill="#ffffff" opacity=".8" stroke="#dbe7f7"/>
      <circle cx="150" cy="477" r="11" fill="#2f6fed"/>
      <text x="172" y="486" fill="#2f6fed">Cluster 1</text>
    </g>
    <g>
      <rect x="756" y="96" width="196" height="50" rx="25" fill="#ffffff" opacity=".8" stroke="#dbe7f7"/>
      <circle cx="788" cy="121" r="11" fill="#2f6fed"/>
      <text x="810" y="130" fill="#2f6fed">Cluster 2</text>
