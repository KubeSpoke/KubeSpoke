    <g transform="translate(225,668) scale(1,0.5) rotate(45)"><rect x="-84" y="-84" width="168" height="168" rx="24" fill="#9db4d0"/></g>
    <g transform="translate(225,654) scale(1,0.5) rotate(45)"><rect x="-84" y="-84" width="168" height="168" rx="24" fill="#c9d9ee"/></g>
    <g transform="translate(225,638) scale(1,0.5) rotate(45)"><rect x="-84" y="-84" width="168" height="168" rx="24" fill="#1d4fc0"/></g>
    <g transform="translate(225,624) scale(1,0.5) rotate(45)"><rect x="-84" y="-84" width="168" height="168" rx="24" fill="#3f7cf0"/></g>
